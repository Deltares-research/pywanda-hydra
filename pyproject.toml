[project]
name = "pywanda-hydra"
version = "0.0.1"
authors = [
    { name = "Mike van Meerkerk", email = "Mike.vanMeerkerk@Deltares.nl" },
    { name = "Sam van der Zwan", email = "sam.vanderzwan@deltares.nl" },
]
description = "Scenario runner for the pywanda package"
readme = "README.md"
requires-python = ">=3.11,<3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]


dependencies = [
    "coloredlogs~=15.0.1",
    "numpy~=2.4.6",
    "pandas~=3.0.3",
    "scipy~=1.17.1",
    "pydantic~=2.12.5",
    "openpyxl~=3.1.5",
    "pyyaml~=6.0.3",
    "xlrd~=2.0.1",
    "typer~=0.26.7",
    "filelock~=3.29.3",
    "pyarrow~=24.0.0",
    "pywanda",
    "matplotlib>=3.7",
    "pypdf>=5.0.0",
]

[tool.uv.sources]
pywanda = { path = "pywanda-4.8.dev2-cp311-cp311-win_amd64.whl" }

[dependency-groups]
dev = [
    "ruff ~= 0.11.13",
    "pytest ~= 8.3.4",
    "pytest-cov ~= 6.0.0",
    "mypy ~= 1.13.0",
    "sphinx~=8.0.2",
    "snakeviz==2.2.0",
    "types-requests ~= 2.28.11",
    "pydeps>=3.0.6",
]

[tool.uv]
default-groups = ["dev"]

[project.urls]
homepage = "https://www.deltares.nl/en/software-and-data/products/wanda-software"
documentation = "https://readthedocs.org"
repository = "https://github.com/Deltares-research/pywanda-hydra"
changelog = "https://github.com/Deltares-research/pywanda-hydra/blob/main/CHANGELOG.md"

[project.scripts]
pywandahydra = "pywandahydra:main"

[project.entry-points."pywandahydra.extractors"]

[project.entry-points."pywandahydra.workflows"]
default = "pywandahydra.postprocessing.workflows.default:DefaultWorkflow"
composed = "pywandahydra.postprocessing.workflows.composed:ConfigDrivenWorkflow"

[project.entry-points."pywandahydra.case_steps"]
summary_table = "pywandahydra.postprocessing.steps.summary_table:SummaryTableStep"
plot_report = "pywandahydra.postprocessing.steps.plot_report:PlotReportStep"

[project.entry-points."pywandahydra.run_steps"]
aggregate_tables = "pywandahydra.postprocessing.steps.aggregate_tables:AggregateTablesStep"
merge_pdfs = "pywandahydra.postprocessing.steps.merge_pdfs:MergePdfsStep"

[project.entry-points."pywandahydra.themes"]
default = "pywandahydra.postprocessing.plotting.theme_registry:DEFAULT_THEME"
deltares_light = "pywandahydra.postprocessing.plotting.theme_registry:DELTARES_LIGHT"

[project.entry-points."pywandahydra.scenario_sources"]
xls = "pywandahydra.scenarios.sources.xls:XlsScenarioSource"

[build-system]
build-backend = "uv_build"
requires = [
    "uv_build>=0.11.19,<0.12",
]

[tool.uv.build-backend]
module-name = "pywandahydra"

[tool.pytest.ini_options]
addopts = "-q --cov=src/pywandahydra --cov-report html --cov-report term-missing --cov-fail-under 50"
testpaths = ["unit_test"]
norecursedirs = [".git", ".venv", "venv", "build", "dist", "notebooks/output"]

[tool.coverage.run]
source = ["src/pywandahydra"]
omit = [
    "*/unit_test/*",
    "*/.venv/*",
    "*/venv/*",
    "*/build/*",
    "*/dist/*",
    "*/notebooks/*",
]

[tool.coverage.report]
omit = [
    "*/unit_test/*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "unit_test"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "doc",    
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "W",  # pycodestyle
    "I",  # import sorting
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "N",  # pep8-naming
    "PT", # flake8-pytest-style
]
extend-ignore = [
    "E203",  # Keep Black-compatible slice spacing
    "N803",  # Allow common scientific naming style
    "N806",  # Allow common scientific naming style
    "PT009", # use a regular assert instead of unittest-style assertion
    "PT027", # pytest.raises() should be used instead of assertRaises()
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]
"src/pywandahydra/cli/commands.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
packages = ["pywandahydra"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
follow_imports_for_stubs = true
exclude = [
    "^build/",
    "^dist/",
    "^doc/",
    "^ci/",
    '^\.venv/',
    "^venv/",
]

[[tool.mypy.overrides]]
module = ["pywanda", "pywanda.*", "scipy", "scipy.*", "matplotlib", "matplotlib.*", "pandas", "pandas.*", "numpy", "numpy.*", "coloredlogs", "coloredlogs.*", "yaml", "yaml.*"]
ignore_missing_imports = true

# mypy per-module options:
[[tool.mypy.overrides]]
module = ["unit_test.*"]
disallow_incomplete_defs = false
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = false
