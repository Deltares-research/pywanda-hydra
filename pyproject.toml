[project]
name = "pywanda-hydra"
dynamic = ["version"]
authors = [
    { name = "Mike van Meerkerk", email = "Mike.vanMeerkerk@Deltares.nl" },
    { name = "Sam van der Zwan", email = "sam.vanderzwan@deltares.nl" },
]
description = "Scenario runner for the pywanda package"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]


dependencies = [
    "coloredlogs~=15.0.1",
    "numpy~=2.1.0",
    "pandas~=2.2.2",
    "scipy~=1.14.1",
    "pydantic~=2.12.5",
    "openpyxl~=3.1.5",
    "pyyaml~=6.0.3",
    "xlrd~=2.0.1",
    "typer~=0.15.0",
    "filelock~=3.16.0",
    "pyarrow~=18.0.0",
    "pywanda~=4.7.0a3",
    "matplotlib>=3.7",
    "pypdf>=5.0.0",
]

[dependency-groups]
dev = [
    "black == 24.10.0",
    "ruff ~= 0.11.13",
    "pytest ~= 8.3.4",
    "pytest-cov ~= 6.0.0",
    "mypy ~= 1.13.0",
    "isort == 6.1.0",
    "sphinx~=8.0.2",
    "snakeviz==2.2.0",
    "types-requests ~= 2.28.11",
]

[project.urls]
homepage = "https://www.deltares.nl/en/software-and-data/products/wanda-software"
documentation = "https://readthedocs.org"
repository = "https://github.com/Deltares-research/pywanda-hydra"
changelog = "https://github.com/Deltares-research/pywanda-hydra/blob/main/CHANGELOG.md"

[project.scripts]
pywandahydra = "pywandahydra:main"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools ~= 69.0.3",
    "wheel ~= 0.40.0",
    "setuptools-git-versioning<2",
]

[tool.setuptools-git-versioning]
enabled = true
version_file = "VERSION"
count_commits_from_version_file = true
dev_template = "{tag}.dev{ccount}"
dirty_template = "{tag}.dev{ccount}"

[tool.setuptools.package-data]
"pywandahydra.postprocessing.plotting.image_data" = ["*.png"]

[tool.pytest.ini_options]
addopts = "--cov=pywandahydra --cov-report html --cov-report term-missing --cov-fail-under 50"
testpaths = ["unit_test"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = [
    ".venv/*",
    "venv/*",
    "doc/*",
]

[tool.ruff.lint]
select = [
    "F",  # pyflakes
    "E",  # pycodestyle
    "W",  # pycodestyle
    "D",  # pydocstyle
    "B",  # flake8-bugbear
    "Q",  # flake8-quotes
    "UP", # pyupgrade
    "PT", # flake8-pytest-style
]
ignore = [
    "Q000",  # Remove bad quotes
    "D401",  # Docstring First line should be imperative
    "E203",  # Space before colon (not PEP-8 compliant, and conflicts with black)
    "C408",  # Suggestion to use dict() over {}
    "PT009", # use a regular assert instead of unittest-style assertion
    "PT027", # pytest.raises() should be used instead of assertRaises()
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]
"unit_test/*" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106"]
"src/pywandahydra/cli/commands.py" = ["B008"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
follow_imports_for_stubs = true
exclude = ['.venv/*', 'venv/*', 'doc/*', 'ci/*']

# mypy per-module options:
[[tool.mypy.overrides]]
module = ["unit_test.*"]
disallow_incomplete_defs = false
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = false
